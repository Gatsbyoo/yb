<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDF6EE">
<meta name="description" content="今天吃啥 —— 帮你决定晚饭，顺手生成买菜清单。32 道家常菜，离线可用。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃啥">
<meta name="format-detection" content="telephone=no">
<title>今天吃啥</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <div class="glow" aria-hidden="true"></div>

  <!-- ============ 今天吃啥 ============ -->
  <main class="view active" id="view-home">
    <header class="hd">
      <div class="eyebrow" id="greet">今天</div>
      <h1 class="title">今天吃啥？</h1>
      <p class="subtitle" id="homeSub">别想了，我给你挑</p>
    </header>

    <div class="chips" id="chipsHome"></div>

    <section class="pick" id="pick">
      <span class="pick-emoji" id="pickEmoji">🍚</span>
      <h2 class="pick-name" id="pickName">正在挑…</h2>
      <div class="pick-meta" id="pickMeta"></div>
      <p class="pick-tip" id="pickTip"></p>
    </section>

    <div class="actions">
      <button class="btn btn-ghost" id="btnRoll" type="button">换一道</button>
      <button class="btn btn-primary" id="btnGo" type="button">就它了</button>
    </div>

    <p class="hintline" id="homeHint"></p>
    <p class="footnote">好好吃饭，比什么都重要</p>
  </main>

  <!-- ============ 菜谱 ============ -->
  <main class="view" id="view-recipes">
    <header class="hd hd-row">
      <div>
        <div class="eyebrow">菜谱库</div>
        <h1 class="title">都会做</h1>
      </div>
      <button class="btn-add" id="btnAdd" type="button">＋ 加一道</button>
    </header>

    <div class="searchwrap">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M16 16l4.6 4.6"/></svg>
        <input id="q" type="search" placeholder="搜菜名或食材" autocomplete="off" aria-label="搜索菜谱">
      </div>
    </div>

    <div class="chips" id="chipsRecipes"></div>
    <div class="rlist" id="rlist"></div>
  </main>

  <!-- ============ 清单 ============ -->
  <main class="view" id="view-list">
    <div class="lhead">
      <div class="lhead-top">
        <h1 class="title ltitle">买菜清单</h1>
        <div class="lcount"><b id="cntDone">0</b> / <span id="cntAll">0</span></div>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </div>

    <div class="groups" id="groups"></div>
    <div id="listEmpty"></div>

    <div class="li-actions" id="listActions">
      <button class="btn btn-line" id="btnClearDone" type="button">清掉已买</button>
      <button class="btn btn-ghost" id="btnCopy" type="button">复制清单</button>
    </div>
  </main>

  <!-- ============ 标签栏 ============ -->
  <nav class="tabbar" role="tablist">
    <button class="tab on" data-view="home" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 11.5h17c0 4.7-3.8 8.5-8.5 8.5S3.5 16.2 3.5 11.5Z"/>
        <path d="M7.8 8c0-1.3 1-1.7 1-3"/>
        <path d="M12 8c0-1.3 1-1.7 1-3"/>
      </svg>
      <span>吃啥</span>
    </button>
    <button class="tab" data-view="recipes" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3.5" width="16" height="17" rx="3"/>
        <path d="M9 3.5v17"/>
        <path d="M12.5 8.5h4"/>
        <path d="M12.5 12.5h4"/>
      </svg>
      <span>菜谱</span>
    </button>
    <button class="tab" data-view="list" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.8 3.6h2.3l2.4 10.6h10.6l2.1-7.6H6.2"/>
        <circle cx="9.2" cy="19.4" r="1.5"/>
        <circle cx="17.6" cy="19.4" r="1.5"/>
      </svg>
      <span>清单</span>
      <i class="badge" id="badge" hidden>0</i>
    </button>
  </nav>
</div>

<!-- ============ 抽屉 ============ -->
<div class="backdrop" id="backdrop"></div>

<section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="sheet-head">
    <div class="sheet-grip"></div>
    <h2 class="sheet-title" id="sheetTitle"></h2>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
